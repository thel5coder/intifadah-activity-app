{% extends 'base/base.html' %}

{% block content %}
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="container-fluid">
            <div class="row">
                <div class="col">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">Tambah Pengguna</div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col">
                                    <form method="POST" class="form-validate">
                                        {% csrf_token %}
                                        <div class="form-group">
                                            <input type="text" class="form-control"
                                                   placeholder="Nomor handphone 081xxxx" name="username">
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control"
                                                   placeholder="password" name="password1">
                                        </div>
                                         <div class="form-group">
                                            <input type="password" class="form-control"
                                                   placeholder="Masukkan kembali password" name="password2">
                                        </div>
{#                                        {{ form }}#}
                                        <a href="index.html" class="btn btn-primary float-left">
                                            Batal
                                        </a>
                                        <button type="submit" class="btn btn-primary float-right">
                                            Simpan
                                        </button>
                                    </form>
                                </div>
                            </div>
                            {% if errors %}
                                <div class="row">
                                    <div class="alert alert-danger" role="alert">
                                        {{ errors }}
                                    </div>
                                </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
