{% extends 'base/base.html' %}
{% load static %}
{% block content %}
    <div id="content-wrapper" class="d-flex flex-column">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Kegiatan Saya
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">5</div>
                                </div>
                                <div class="col-auto">
                                    <a href="#">
                                        <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-info shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Kegiatan Di Setujui
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">3</div>
                                </div>
                                <div class="col-auto">
                                    <a href="#">
                                        <i class="fas fa-calendar-check fa-2x text-gray-300"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-secondary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Kegiatan Menunggu Persetujuan
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">1</div>
                                </div>
                                <div class="col-auto">
                                    <a href="#">
                                        <i class="fas fa-clock fa-2x text-gray-300"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-danger shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Kegiatan Di Tolak
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">0</div>
                                </div>
                                <div class="col-auto">
                                    <a href="#">
                                        <i class="fas fa-archive fa-2x text-gray-300"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="btn-group" role="group" aria-label="Basic example">
                        <a href="{% url 'activity-create' %}" class="btn btn-primary btn-icon-split">
                            <span class="icon text-white-50"><i class="fas fa-pencil-alt"></i></span>
                            <span class="text">Tambah Kegiatan</span>
                        </a>
                        <a href="{% url 'activity-list' %}" class="btn btn-primary btn-icon-split">
                            <span class="icon text-white-50"><i class="fas fa-briefcase"></i></span>
                            <span class="text">Kegiatan Saya</span>
                        </a>
                        <button type="button" class="btn btn-primary btn-icon-split">
                            <span class="icon text-white-50"><i class="fas fa-chart-bar"></i></span>
                            <span class="text">Lihat Statistik</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
